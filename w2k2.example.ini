; Voorbeeldconfiguratie voor nmea2log-download.
;
; Kopieer dit bestand naar w2k2.ini, in dezelfde map (de projectmap), en vul daar je eigen
; gegevens in. w2k2.ini staat in .gitignore en wordt dus nooit gecommit.
;
; Let op: deze projectmap staat wel in OneDrive, dus een wachtwoord hier synct mee naar de
; cloud en je andere pc. Wil je dat niet, geef dan bij nmea2log-download een pad buiten
; OneDrive op via --config, bijvoorbeeld ~/.nmea2log/w2k2.ini.
;
; PowerShell:
;   Copy-Item w2k2.example.ini w2k2.ini
;   notepad w2k2.ini

[w2k2]
; IP-adres of hostnaam van de W2K-2 op jouw netwerk.
url = http://10.164.231.101

; Optie A: gebruikersnaam + wachtwoord (het script logt hiermee automatisch in).
user = admin
password =

; Optie B: een token direct invullen (haal het uit de browser-DevTools, Network-tab, na het
; inloggen op de webinterface). Als dit is ingevuld, wordt user/password overgeslagen.
;token =

; Map waar de gedownloade .ebl-bestanden komen (mapstructuur EBL000000/, EBL000001/, ... wordt
; hieronder aangemaakt). Mag prima buiten deze projectmap staan.
download_dir = ebl_logs
