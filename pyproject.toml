[project]
name = "nmea2000processor"
version = "0.1.0"
description = "Turns Actisense W2K-2 NMEA2000 log files into a sailing logbook: ports, fuel consumption (engine data) and engine hours."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
nmea2log = "nmea2000processor.cli:main"
nmea2log-download = "nmea2000processor.w2k2_download:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
